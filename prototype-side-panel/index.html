<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import React, { useState, useReducer, useEffect, useRef, useLayoutEffect } from 'react';
import { createRoot } from 'react-dom/client';
import { createPortal } from 'react-dom';
import htm from 'htm';
const html = htm.bind(React.createElement);

// ============================== fake Office state ==============================
let SEQ = 0;
const clock = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const mk = (kind, text) => ({ kind, text, at: clock(), seq: ++SEQ });
const RUNNING = ['Starting', 'Working', 'Needs-you'];
const ENDED = ['Done', 'Stopped'];
const CAP = 6;
const slug = p => p.toLowerCase().replace(/[^a-z0-9 ]/g, '').split(' ').filter(Boolean).slice(0, 4).join('-');
const id4 = () => Math.random().toString(16).slice(2, 6);

const PROJECTS = {
  'ai-office': ['master', 'prototype/art-kit'],
  'quran-reader': ['main', 'feat/tafsir'],
  'dotfiles': ['main'],
  'blog': ['main', 'draft/r3f-post'],
};

const genericScript = prompt => [
  { tool: 'Read', arg: 'AGENTS.md' },
  { say: `Plan: ${prompt}. Reading the code around it first.` },
  { tool: 'Grep', arg: '"export" src/' },
  { edit: 'src/index.ts', patch: ['@@ -1,3 +1,5 @@', ' import { app } from "./app";', `+// ${prompt}`, '+export const ready = true;', ' app.start();'] },
  { ask: { kind: 'permission', tool: 'Bash', input: 'pnpm test', reason: 'Shell commands always raise Needs-you.' } },
  { tool: 'Bash', arg: 'pnpm test → 12 passed' },
  { end: 'Done: 1 file changed, tests pass. Want a PR?' },
];
const replyScript = text => [
  { say: 'On it.' },
  { edit: 'src/app.ts', patch: ['@@ -10,2 +10,3 @@', ' export function start() {', `+  // ${text.slice(0, 40)}`, ' }'] },
  /\bpr\b/i.test(text)
    ? { tool: 'Bash', arg: 'gh pr create --fill → #42' , pr: true }
    : { tool: 'Read', arg: 'src/app.ts' },
  { end: /\bpr\b/i.test(text) ? 'Opened PR #42.' : 'Updated as asked.' },
];

function thread(o) {
  const tid = id4();
  return {
    id: tid, room: 'ai-office', base: 'master', model: 'sonnet', desk: null, pending: null, since: null,
    diff: [], pr: null, error: null, step: 0, script: genericScript(o.title), endNote: null,
    branch: `office/${slug(o.title)}-${tid}`, ...o,
  };
}
const initial = () => {
  const t = [
    thread({ title: 'Add Room discovery', state: 'Working', desk: 0,
      transcript: [mk('user', 'Auto-discover git repos under C:\\Projects\\personal as Rooms, with a per-Room hide.'), mk('agent', 'Starting with the filesystem scan.'), mk('tool', 'Read src/rooms.ts')],
      script: [
        { sub: 'Explore — mapping how Projects are listed today' },
        { tool: 'Glob', arg: 'C:\\Projects\\personal\\*\\.git' },
        { say: 'Found 4 repos. .worktrees is skipped since it is not a repo itself.' },
        { edit: 'src/rooms.ts', patch: ['@@ -1,4 +1,12 @@', '+import { readdir } from "node:fs/promises";', '+export async function discoverRooms(root) {', '+  const dirs = await readdir(root, { withFileTypes: true });', '+  return dirs.filter(d => d.isDirectory() && !d.name.startsWith("."));', '+}', ' export const rooms = [];'] },
        { sub: 'Explore — done' },
        { ask: { kind: 'permission', tool: 'Bash', input: 'node scripts/list-repos.mjs C:\\Projects\\personal', reason: 'Shell commands always raise Needs-you.' } },
        { tool: 'Bash', arg: 'node scripts/list-repos.mjs → ai-office, quran-reader, dotfiles, blog' },
        { edit: 'src/settings.ts', patch: ['@@ -3,1 +3,2 @@', ' export const settings = {', '+  hiddenRooms: [] as string[],'] },
        { end: 'Rooms are auto-discovered; hide list lives in settings. 2 files changed.' },
      ] }),
    thread({ title: 'Fix glossary links', state: 'Needs-you', desk: 1, since: Date.now() - 42000,
      transcript: [mk('user', 'GLOSSARY.md links to docs that moved. Fix them.'), mk('tool', 'Grep "](docs/" GLOSSARY.md'), mk('agent', 'Two links point at docs/old/. The files now live in docs/agents/.')],
      pending: { kind: 'permission', tool: 'Bash', input: 'git mv docs/old/triage.md docs/agents/triage.md', reason: 'Shell commands always raise Needs-you.' },
      script: [{ tool: 'Bash', arg: 'git mv … → ok' }, { edit: 'GLOSSARY.md', patch: ['@@ -12 +12 @@', '-See [triage](docs/old/triage.md)', '+See [triage](docs/agents/triage.md)'] }, { end: 'Links fixed.' }] }),
    thread({ title: 'Spike the R3F scene', state: 'Needs-you', desk: 2, model: 'opus', since: Date.now() - 8000,
      transcript: [mk('user', 'Spike a React Three Fiber scene with one Room.'), mk('tool', 'Read designs/preview-1.mp4 (skipped: binary)'), mk('agent', 'Before I build the camera I need one decision.')],
      pending: { kind: 'question', question: 'Which camera for the Office?', options: ['Orthographic isometric', 'Perspective, low FOV', 'Both, with a toggle'] },
      script: [{ say: 'Going with that.' }, { edit: 'src/scene/Camera.tsx', patch: ['@@ -0,0 +1,3 @@', '+export function Camera() {', '+  return <OrthographicCamera makeDefault zoom={60} />;', '+}'] }, { end: 'Camera in. Scene renders one Room.' }] }),
    thread({ title: 'Write the README', state: 'Idle', desk: 3, model: 'haiku',
      transcript: [mk('user', 'Write the README, including the Chrome ignore-gpu-blocklist flag.'), mk('tool', 'Write README.md'), mk('agent', 'README written: setup, the GPU flag, and how to run. Want a PR?')],
      diff: [{ file: 'README.md', patch: ['@@ -0,0 +1,6 @@', '+# AI Office', '+', '+Local control room for coding agents.', '+', '+> Chrome: enable chrome://flags/#ignore-gpu-blocklist', '+> or WebGL falls back to software.'] }],
      script: [] }),
    thread({ title: 'Bump three to 0.170', state: 'Failed', desk: 4,
      transcript: [mk('user', 'Bump three and fix whatever breaks.'), mk('tool', 'Bash pnpm up three@0.170'), mk('error', 'error_during_execution: ENOENT pnpm-lock.yaml')],
      error: 'error_during_execution: ENOENT pnpm-lock.yaml', script: genericScript('bump three') }),
    thread({ title: 'Add dark theme', state: 'Queued', transcript: [mk('user', 'Add a dark theme toggle.')] }),
    thread({ title: 'Refactor agent runner', state: 'Done', endNote: 'Branch kept · worktree removed (clean)',
      transcript: [mk('user', 'Pull the SDK calls behind one module.'), mk('agent', 'Done. agent-runner.ts speaks Office events.')],
      diff: [{ file: 'src/agent-runner.ts', patch: ['@@ -0,0 +1,2 @@', '+export function runThread() {}', '+export type OfficeEvent = {};'] }], pr: { n: 7 }, script: [] }),
    thread({ room: 'quran-reader', base: 'main', title: 'Add tafsir side-by-side', state: 'Working', desk: 0,
      transcript: [mk('user', 'Show tafsir next to the ayah.')], script: genericScript('add tafsir side-by-side') }),
    thread({ room: 'blog', base: 'main', title: 'Draft R3F post outline', state: 'Needs-you', desk: 0, since: Date.now() - 120000,
      transcript: [mk('user', 'Outline a post about the Office scene.')],
      pending: { kind: 'permission', tool: 'Write', input: 'C:\\Projects\\personal\\ai-office\\notes.md', reason: 'Outside this Thread\'s worktree.' },
      script: [{ say: 'Writing the outline.' }, { end: 'Outline ready.' }] }),
  ];
  // diffs for script edits already "made"
  t[0].diff = [{ file: 'src/rooms.ts', patch: ['@@ -0,0 +1,1 @@', '+// rooms'] }];
  const sel = new URLSearchParams(location.search).get('sel'); // debug: ?sel=<index> opens a Thread
  return { threads: t, room: 'ai-office', selected: sel ? t[+sel].id : null };
};

const freeDesk = (threads, room) => {
  const used = new Set(threads.filter(t => t.room === room && t.desk != null && !ENDED.includes(t.state)).map(t => t.desk));
  for (let i = 0; i < 6; i++) if (!used.has(i)) return i;
  return null;
};
const slotsUsed = s => s.threads.filter(t => RUNNING.includes(t.state)).length;

function advance(t) { // one scripted step of a Working Thread
  const item = t.script[t.step];
  if (!item) return { ...t, state: 'Idle', transcript: [...t.transcript, mk('agent', 'Turn finished.')] };
  t = { ...t, step: t.step + 1 };
  if (item.tool) return { ...t, transcript: [...t.transcript, mk('tool', `${item.tool} ${item.arg}`)], pr: item.pr ? { n: 42 } : t.pr };
  if (item.say) return { ...t, transcript: [...t.transcript, mk('agent', item.say)] };
  if (item.sub) return { ...t, transcript: [...t.transcript, mk('sub', item.sub)] };
  if (item.edit) {
    const diff = [...t.diff.filter(d => d.file !== item.edit), { file: item.edit, patch: item.patch }];
    return { ...t, diff, transcript: [...t.transcript, mk('tool', `Edit ${item.edit}`)] };
  }
  if (item.ask) return { ...t, state: 'Needs-you', pending: item.ask, since: Date.now() };
  if (item.end) return { ...t, state: 'Idle', transcript: [...t.transcript, mk('agent', item.end)] };
  return t;
}

function reducer(s, a) {
  const upd = (id, f) => ({ ...s, threads: s.threads.map(t => t.id === id ? f(t) : t) });
  const resume = (t, extra) => { // Idle/Failed → Starting, or Queued if every slot is taken
    const free = slotsUsed(s) < CAP;
    return { ...t, ...extra, state: free ? 'Starting' : 'Queued', desk: t.desk ?? (free ? freeDesk(s.threads, t.room) : null) };
  };
  switch (a.type) {
    case 'tick': {
      let used = slotsUsed(s);
      const threads = s.threads.map(t => {
        if (t.state === 'Starting') return { ...t, state: 'Working' };
        if (t.state === 'Working' && Math.random() < 0.55) return advance(t);
        if (t.state === 'Queued' && used < CAP) { used++; return { ...t, state: 'Starting', desk: t.desk ?? freeDesk(s.threads, t.room), transcript: [...t.transcript, mk('system', 'Slot free — worktree created, starting.')] }; }
        return t;
      });
      return { ...s, threads };
    }
    case 'room': return { ...s, room: a.room, selected: null };
    case 'select': {
      const t = s.threads.find(t => t.id === a.id);
      return { ...s, selected: a.id, room: t ? t.room : s.room };
    }
    case 'allow': return upd(a.id, t => ({ ...t, state: 'Working', pending: null, since: null, transcript: [...t.transcript, mk('system', `✓ Allowed: ${t.pending.tool} ${t.pending.input}`)] }));
    case 'deny': return upd(a.id, t => ({ ...t, state: 'Working', pending: null, since: null, step: t.step + 1,
      transcript: [...t.transcript, mk('system', `✕ Denied: ${t.pending.tool}${a.note ? ` — “${a.note}”` : ''}`), mk('agent', 'Understood, taking another route.')] }));
    case 'answer': return upd(a.id, t => ({ ...t, state: 'Working', pending: null, since: null, transcript: [...t.transcript, mk('user', a.option)] }));
    case 'send': return upd(a.id, t => {
      const msg = mk('user', a.text);
      if (t.state === 'Working') return { ...t, transcript: [...t.transcript, { ...msg, steer: true }] };
      if (t.state === 'Needs-you') return { ...t, state: 'Working', pending: null, since: null, transcript: [...t.transcript, mk('system', `✕ Denied: ${t.pending.tool ?? 'question'}`), msg] };
      return resume(t, { transcript: [...t.transcript, msg], script: [...t.script.slice(0, t.step), ...replyScript(a.text)] });
    });
    case 'interrupt': return upd(a.id, t => ({ ...t, state: 'Idle', pending: null, transcript: [...t.transcript, mk('system', 'Interrupted — turn cancelled.')] }));
    case 'stop': return upd(a.id, t => ({ ...t, state: 'Stopped', pending: null, endNote: t.diff.length ? 'Branch kept · worktree kept (uncommitted changes)' : 'Branch kept · worktree removed (clean)', transcript: [...t.transcript, mk('system', 'Stopped by you.')] }));
    case 'done': return upd(a.id, t => ({ ...t, state: 'Done', endNote: 'Branch kept · worktree removed (clean)', transcript: [...t.transcript, mk('system', 'Marked done.')] }));
    case 'retry': return upd(a.id, t => resume(t, { error: null, transcript: [...t.transcript, mk('system', 'Retrying — same session, same worktree.')] }));
    case 'end': return upd(a.id, t => ({ ...t, state: 'Stopped', endNote: 'Ended after failure · branch kept', transcript: [...t.transcript, mk('system', 'Ended.')] }));
    case 'discard': return { ...s, selected: null, threads: s.threads.filter(t => t.id !== a.id) };
    case 'new': {
      const free = slotsUsed(s) < CAP;
      const t = thread({ room: a.room, title: a.prompt.split(/[.\n]/)[0].slice(0, 40), base: a.base, model: a.model,
        state: free ? 'Starting' : 'Queued', desk: free ? freeDesk(s.threads, a.room) : null,
        transcript: [mk('user', a.prompt)], script: genericScript(a.prompt.slice(0, 40)) });
      return { ...s, threads: [...s.threads, t], room: a.room, selected: a.select ? t.id : s.selected };
    }
  }
  return s;
}

// ============================== scene (three.js) ==============================
// Plain three.js stand-in for the R3F scene; same GPU budget as the art-kit prototype (pixel ratio 1, ~30 fps cap, no shadows).
const CHAR_FILES = ['male-a', 'female-a', 'male-b', 'female-b', 'male-c', 'female-c', 'female-d'].map(c => `assets/mini/character-${c}.glb`);
const FURN = ['desk', 'chairDesk', 'computerScreen', 'computerKeyboard', 'floorFull', 'wall', 'wallWindow', 'wallDoorway', 'plantSmall1', 'pottedPlant', 'loungeSofa', 'bookcaseOpen', 'rugRectangle', 'lampRoundFloor'];
const SEATS = [[1, 1.4], [2.4, 1.4], [3.8, 1.4], [1, 3.4], [2.4, 3.4], [3.8, 3.4]];
const loader = new GLTFLoader();
const assets = (async () => {
  const [f, c] = await Promise.all([Promise.all(FURN.map(n => loader.loadAsync(`assets/furniture/${n}.glb`))), Promise.all(CHAR_FILES.map(u => loader.loadAsync(u)))]);
  const furn = Object.fromEntries(FURN.map((n, i) => {
    const s = f[i].scene, b = new THREE.Box3().setFromObject(s), ctr = b.getCenter(new THREE.Vector3());
    s.position.set(-ctr.x, -b.min.y, -ctr.z); const g = new THREE.Group(); g.add(s); return [n, g];
  }));
  return { furn, chars: c };
})();
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 0);

function mountScene(el, onPick) {
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'low-power' });
  renderer.setPixelRatio(1);
  el.appendChild(renderer.domElement);
  const labels = new CSS2DRenderer();
  Object.assign(labels.domElement.style, { position: 'absolute', inset: '0', pointerEvents: 'none' });
  el.appendChild(labels.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#1c1f26');
  scene.add(new THREE.HemisphereLight('#fff6e8', '#5a6070', 2.2));
  const sun = new THREE.DirectionalLight('#fff', 1.6); sun.position.set(4, 8, 3); scene.add(sun);
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(2.8, 0, 2.6); camera.position.set(12.8, 10, 12.6); camera.zoom = 1.6;
  const resize = () => {
    const w = el.clientWidth, h = el.clientHeight, a = w / h;
    Object.assign(camera, { left: -4 * a, right: 4 * a, top: 4, bottom: -4 }); camera.updateProjectionMatrix();
    renderer.setSize(w, h); labels.setSize(w, h);
  };
  const ro = new ResizeObserver(resize); ro.observe(el); resize(); controls.update();

  const anchors = new Map(); // thread id → div that React portals bubbles into
  const anchorFor = id => { if (!anchors.has(id)) { const d = document.createElement('div'); anchors.set(id, d); } return anchors.get(id); };
  const chars = new Map();
  let A = null, last = { threads: [], selected: null, ring: false };
  const RING = new THREE.RingGeometry(0.22, 0.28, 32);
  const ringMat = c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide });

  assets.then(a => {
    A = a;
    const put = (n, x, z, r = 0) => { const o = a.furn[n].clone(); o.position.set(x, 0, z); o.rotation.y = r; scene.add(o); return o; };
    for (let x = 0; x < 6; x++) for (let z = 0; z < 5; z++) put('floorFull', x + 0.5, z + 0.5);
    for (let x = 0; x < 6; x++) put(x === 2 || x === 4 ? 'wallWindow' : 'wall', x + 0.5, 0);
    for (let z = 0; z < 5; z++) put(z === 2 ? 'wallDoorway' : 'wall', 0, z + 0.5, Math.PI / 2);
    put('rugRectangle', 4.8, 4.4); put('loungeSofa', 4.8, 4.75, Math.PI); put('pottedPlant', 5.6, 0.4);
    put('bookcaseOpen', 0.25, 4.4, Math.PI / 2); put('lampRoundFloor', 5.65, 3.6);
    for (const [x, z] of SEATS) {
      put('desk', x, z, Math.PI);
      put('computerScreen', x, z + 0.1).position.y = 0.38;
      put('computerKeyboard', x, z - 0.08).position.y = 0.38;
      put('chairDesk', x, z - 0.42);
    }
    update(last.threads, last.selected, last.ring);
  });

  function makeChar(t) {
    const g = A.chars[Math.abs(hash(t.id)) % A.chars.length];
    const root = SkeletonUtils.clone(g.scene);
    const box = new THREE.Box3().setFromObject(g.scene), s = 0.62 / (box.max.y - box.min.y);
    const holder = new THREE.Group(); holder.add(root); root.scale.setScalar(s); root.position.y = -box.min.y * s;
    holder.userData.id = t.id;
    const mixer = new THREE.AnimationMixer(root), bones = {};
    root.traverse(o => { bones[o.name] = o; o.userData.id = t.id; });
    const armBase = ['arm-left', 'arm-right'].filter(n => bones[n]).map(n => [bones[n], bones[n].quaternion.clone()]);
    const label = new CSS2DObject(anchorFor(t.id)); label.position.y = 0.95; holder.add(label);
    const ring = new THREE.Mesh(RING, ringMat('#f59e0b')); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.02; ring.visible = false; holder.add(ring);
    const sel = new THREE.Mesh(RING, ringMat('#fafafa')); sel.rotation.x = -Math.PI / 2; sel.position.y = 0.015; sel.scale.setScalar(1.25); sel.visible = false; holder.add(sel);
    scene.add(holder);
    return { holder, mixer, bones, armBase, ring, sel, clipName: null, phase: Math.random() * 10, gltf: g };
  }

  function update(threads, selected, ring) {
    last = { threads, selected, ring };
    if (!A) return;
    const live = new Set();
    const queued = threads.filter(t => t.state === 'Queued');
    for (const t of threads) {
      if (ENDED.includes(t.state)) continue;
      live.add(t.id);
      let c = chars.get(t.id); if (!c) chars.set(t.id, c = makeChar(t));
      const seated = t.state !== 'Queued' && t.desk != null;
      if (seated) { const [x, z] = SEATS[t.desk]; c.holder.position.set(x, 0.08, z - 0.38); c.holder.rotation.y = 0; }
      else { const i = queued.indexOf(t); c.holder.position.set(0.45 + 0.4 * Math.max(i, 0), 0, 2.5); c.holder.rotation.y = Math.PI / 2; }
      const clipName = seated ? 'sit' : 'idle';
      if (c.clipName !== clipName) { c.mixer.stopAllAction(); c.mixer.clipAction(THREE.AnimationClip.findByName(c.gltf.animations, clipName)).play(); c.clipName = clipName; }
      c.role = t.state === 'Working' || t.state === 'Starting' ? 'typing' : t.state === 'Needs-you' ? 'hand' : 'still';
      c.ring.visible = ring && t.state === 'Needs-you';
      c.sel.visible = t.id === selected;
    }
    for (const [id, c] of chars) if (!live.has(id)) { scene.remove(c.holder); chars.delete(id); }
  }

  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  renderer.domElement.addEventListener('click', e => {
    const r = renderer.domElement.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects([...chars.values()].map(c => c.holder), true).find(h => h.object.userData.id);
    onPick(hit ? hit.object.userData.id : null);
  });

  const zAxis = new THREE.Vector3(0, 0, 1);
  let lastT = 0, t = 0, raf;
  const tick = now => {
    raf = requestAnimationFrame(tick);
    if (now - lastT < 1000 / 30 - 1) return; // ~30 fps cap
    const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now; t += dt;
    for (const c of chars.values()) {
      for (const [b, q] of c.armBase) { b.quaternion.copy(q); b.scale.setScalar(1); }
      c.mixer.update(dt);
      const L = c.bones['arm-left'], R = c.bones['arm-right'];
      if (!L || !R) continue;
      if (c.role === 'typing') { const k = Math.sin((t + c.phase) * 14) * 0.12; L.rotateOnAxis(zAxis, 0.9 + k); R.rotateOnAxis(zAxis, 0.9 - k); }
      if (c.role === 'hand') { L.quaternion.copy(c.armBase[0][1]); L.scale.setScalar(2); L.rotateOnAxis(zAxis, 1.2 + Math.sin((t + c.phase) * 6) * 0.25); }
      if (c.ring.visible) c.ring.scale.setScalar(1 + 0.15 * Math.sin(t * 5));
    }
    renderer.render(scene, camera); labels.render(scene, camera);
  };
  raf = requestAnimationFrame(tick);
  return { update, anchorFor, dispose: () => { cancelAnimationFrame(raf); ro.disconnect(); renderer.dispose(); el.innerHTML = ''; } };
}

function Scene({ threads, selected, onPick, bubble, ring, className = '' }) {
  const el = useRef(), sc = useRef(), [ready, setReady] = useState(false);
  const pick = useRef(onPick); pick.current = onPick;
  useEffect(() => { sc.current = mountScene(el.current, id => pick.current(id)); setReady(true); return () => sc.current.dispose(); }, []);
  useLayoutEffect(() => { sc.current?.update(threads, selected, ring); }, [threads, selected, ring, ready]);
  return html`<div className=${className}><div className="relative h-full w-full overflow-hidden">
    <div ref=${el} className="absolute inset-0"></div>
    ${ready && threads.filter(t => !ENDED.includes(t.state)).map(t => createPortal(
      html`<div className="pointer-events-auto -translate-y-1/2" onClick=${e => { e.stopPropagation(); onPick(t.id); }}>${bubble(t)}</div>`,
      sc.current.anchorFor(t.id), t.id))}
  </div></div>`;
}

const STATE_STYLE = {

  'Working': 'bg-sky-500/15 text-sky-300 border-sky-500/30',
  'Needs-you': 'bg-amber-500 text-black border-amber-400 font-semibold',
  'Idle': 'bg-zinc-500/15 text-zinc-300 border-zinc-500/30',
  'Failed': 'bg-red-500/15 text-red-300 border-red-500/30',
  'Done': 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30',
  'Stopped': 'bg-zinc-700/30 text-zinc-400 border-zinc-600/30',
};
const DOT = { 'Queued': 'bg-violet-400', 'Starting': 'bg-sky-400', 'Working': 'bg-sky-400 animate-pulse', 'Needs-you': 'bg-amber-400', 'Idle': 'bg-zinc-400', 'Failed': 'bg-red-400', 'Done': 'bg-emerald-400', 'Stopped': 'bg-zinc-600' };
const Pill = ({ state }) => html`<span className=${'inline-flex items-center rounded-md border px-1.5 py-0.5 text-[11px] leading-none whitespace-nowrap ' + STATE_STYLE[state]}>${state}</span>`;
const Dot = ({ state }) => html`<span className=${'inline-block h-2 w-2 shrink-0 rounded-full ' + DOT[state]}></span>`;
const BTN = {
  default: 'bg-zinc-800 hover:bg-zinc-700 text-zinc-100 border border-zinc-700',
  primary: 'bg-zinc-100 hover:bg-white text-zinc-900',
  amber: 'bg-amber-500 hover:bg-amber-400 text-black font-medium',
  ghost: 'hover:bg-zinc-800 text-zinc-300',
  danger: 'bg-red-600/90 hover:bg-red-500 text-white',
};
const Btn = ({ kind = 'default', size = 'sm', className = '', ...p }) =>
  html`<button ...${p} className=${`inline-flex items-center justify-center gap-1 rounded-md ${size === 'xs' ? 'h-6 px-2 text-xs' : 'h-8 px-3 text-sm'} transition-colors disabled:opacity-40 ${BTN[kind]} ${className}`} />`;
const waited = t => { if (!t.since) return ''; const s = Math.floor((Date.now() - t.since) / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const stats = t => t.diff.reduce((a, d) => { for (const l of d.patch) { if (l[0] === '+') a.add++; if (l[0] === '-') a.del++; } return a; }, { add: 0, del: 0 });
const needing = s => s.threads.filter(t => t.state === 'Needs-you').sort((a, b) => a.since - b.since);

function Pending({ t, api, compact }) {
  const p = t.pending; if (!p) return null;
  const stop = e => e.stopPropagation();
  if (p.kind === 'question') return html`<div onClick=${stop} className="rounded-lg border border-amber-500/60 bg-amber-500/10 p-3 text-sm">
    <div className="font-medium text-amber-300">${p.question}</div>
    <div className=${'mt-2 flex gap-1.5 ' + (compact ? 'flex-col' : 'flex-wrap')}>${p.options.map(o => html`<${Btn} key=${o} size="xs" kind="default" onClick=${() => api.answer(t.id, o)}>${o}</${Btn}>`)}</div>
  </div>`;
  return html`<div onClick=${stop} className="rounded-lg border border-amber-500/60 bg-amber-500/10 p-3 text-sm">
    <div className="flex items-center justify-between gap-2"><span className="font-medium text-amber-300">Wants to ${p.tool === 'Bash' ? 'run' : p.tool.toLowerCase()}</span>${!compact && html`<span className="text-[11px] text-amber-200/70">waiting ${waited(t)}</span>`}</div>
    <code className="mt-1.5 block break-all rounded bg-black/50 px-2 py-1 font-mono text-xs text-zinc-200">${p.input}</code>
    ${!compact && html`<div className="mt-1.5 text-xs text-zinc-400">${p.reason}</div>`}
    <div className="mt-2 flex gap-1.5"><${Btn} size="xs" kind="amber" onClick=${() => api.allow(t.id)}>Allow</${Btn}><${Btn} size="xs" onClick=${() => api.deny(t.id)}>Deny</${Btn}></div>
  </div>`;
}

function Transcript({ t, chat }) {
  const ref = useRef();
  useEffect(() => { ref.current && (ref.current.scrollTop = ref.current.scrollHeight); }, [t.transcript.length]);
  return html`<div ref=${ref} className="flex-1 min-h-0 overflow-y-auto space-y-2 p-3 text-sm">
    ${t.transcript.map(e => {
      if (e.kind === 'user') return chat
        ? html`<div key=${e.seq} className="flex justify-end"><div className="max-w-[80%] rounded-2xl rounded-br-sm bg-zinc-100 px-3 py-2 text-zinc-900">${e.steer && html`<span className="text-[10px] uppercase tracking-wide text-zinc-500">steer · </span>`}${e.text}</div></div>`
        : html`<div key=${e.seq} className="rounded-md border border-zinc-800 bg-zinc-900 px-3 py-2"><span className="text-xs text-zinc-500">${e.steer ? 'You (steer)' : 'You'} · ${e.at}</span><div>${e.text}</div></div>`;
      if (e.kind === 'agent') return html`<div key=${e.seq} className="text-zinc-200">${e.text}</div>`;
      if (e.kind === 'tool') return html`<div key=${e.seq} className="font-mono text-xs text-zinc-500">⏺ ${e.text}</div>`;
      if (e.kind === 'sub') return html`<div key=${e.seq} className="text-xs text-violet-300">◆ Subagent ${e.text}</div>`;
      if (e.kind === 'error') return html`<div key=${e.seq} className="rounded-md border border-red-500/40 bg-red-500/10 px-3 py-2 font-mono text-xs text-red-300">${e.text}</div>`;
      return html`<div key=${e.seq} className="text-center text-xs italic text-zinc-500">${e.text}</div>`;
    })}
    ${t.state === 'Working' && html`<div className="text-xs text-sky-300 animate-pulse">working…</div>`}
  </div>`;
}

function Changes({ t }) {
  const st = stats(t);
  return html`<div className="space-y-2 p-3 text-sm">
    <div className="rounded-lg border border-zinc-800 bg-zinc-900 p-3 space-y-1">
      <div className="font-mono text-xs"><span className="text-zinc-100">${t.branch}</span> <span className="text-zinc-500">← ${t.base}</span></div>
      <div className="text-xs text-zinc-400">${t.diff.length} file${t.diff.length === 1 ? '' : 's'} · <span className="text-emerald-400">+${st.add}</span> <span className="text-red-400">−${st.del}</span> vs ${t.base}</div>
      <div className="text-xs">${t.pr ? html`<a className="text-sky-400 underline" href="#" onClick=${e => e.preventDefault()}>PR #${t.pr.n} → ${t.base}</a>` : html`<span className="text-zinc-500">No PR — ask the Thread to open one</span>`}</div>

    </div>
    ${t.diff.length === 0 && html`<div className="text-xs text-zinc-500">No changes yet.</div>`}
    ${t.diff.map(d => html`<details key=${d.file} open className="rounded-lg border border-zinc-800 overflow-hidden">
      <summary className="cursor-pointer bg-zinc-900 px-3 py-1.5 font-mono text-xs">${d.file}</summary>
      <pre className="overflow-x-auto bg-black/40 text-[11px] leading-5">${d.patch.map((l, i) => html`<div key=${i} className=${'px-3 ' + (l[0] === '+' ? 'bg-emerald-500/10 text-emerald-300' : l[0] === '-' ? 'bg-red-500/10 text-red-300' : l[0] === '@' ? 'text-sky-400' : 'text-zinc-400')}>${l}</div>`)}</pre>
    </details>`)}
  </div>`;
}

function Composer({ t, api, chat }) {
  const [v, setV] = useState('');
  if (ENDED.includes(t.state)) return null;
  const ph = { Working: 'Steer this Thread… (goes in mid-turn)', 'Needs-you': 'Or type instead — denies the request with your note', Idle: 'Reply…', Failed: 'Reply (retries the Thread)…', Queued: 'Add to the prompt…', Starting: 'Steer…' }[t.state];
  const send = () => { if (!v.trim()) return; api.send(t.id, v.trim()); setV(''); };
  return html`<div className="border-t border-zinc-800 p-2">
    <div className=${'flex items-end gap-2 rounded-lg border border-zinc-700 bg-zinc-900 p-1.5 ' + (chat ? 'rounded-2xl' : '')}>
      <textarea rows="1" value=${v} onChange=${e => setV(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
        placeholder=${ph} className="flex-1 resize-none bg-transparent px-1.5 py-1 text-sm outline-none placeholder:text-zinc-500" />
      <${Btn} size="xs" kind="primary" onClick=${send}>Send</${Btn}>
    </div>
  </div>`;
}

function Actions({ t, api }) {
  const confirmThen = (msg, f) => () => { if (confirm(msg)) f(); };
  return html`<div className="flex flex-wrap gap-1.5">
    ${t.state === 'Working' && html`<${Btn} size="xs" onClick=${() => api.interrupt(t.id)}>Interrupt</${Btn}>`}
    ${t.state === 'Idle' && html`<${Btn} size="xs" onClick=${() => api.done(t.id)}>Mark done</${Btn}>`}
    ${t.state === 'Failed' && html`<${Btn} size="xs" kind="primary" onClick=${() => api.retry(t.id)}>Retry</${Btn}><${Btn} size="xs" onClick=${() => api.end(t.id)}>End</${Btn}>`}
    ${!ENDED.includes(t.state) && t.state !== 'Failed' && html`<${Btn} size="xs" kind="ghost" onClick=${confirmThen('Stop this Thread? Its branch is kept.', () => api.stop(t.id))}>Stop</${Btn}>`}
    ${ENDED.includes(t.state) && html`<${Btn} size="xs" kind="danger" onClick=${confirmThen(`Discard? Deletes worktree and branch ${t.branch}.`, () => api.discard(t.id))}>Discard</${Btn}>`}
  </div>`;
}

function NewThreadForm({ s, api, onDone, compact, autoFocus }) {

  return html`<div className="space-y-2">
    <textarea autoFocus=${autoFocus} rows=${compact ? 2 : 4} value=${prompt} onChange=${e => setPrompt(e.target.value)}

}

      <div className="absolute left-3 top-3 flex flex-col gap-2">
        <${RoomTabs} s=${s} api=${api} className="rounded-lg bg-zinc-950/80 p-1" />
        <div className="flex gap-1.5 text-xs">${['Working', 'Idle', 'Queued', 'Failed'].map(st => html`<span key=${st} className="flex items-center gap-1 rounded-md bg-zinc-950/80 px-2 py-1"><${Dot} state=${st} />${ts.filter(t => t.state === st).length} ${st.toLowerCase()}</span>`)}</div>
      </div>
      ${sel && html`<div className="absolute inset-y-0 right-0 z-30 flex w-[460px] flex-col border-l border-zinc-800 bg-zinc-950 shadow-2xl">
        <div className="border-b border-zinc-800 p-3 space-y-1.5">
          <div className="flex items-center gap-2"><span className="truncate font-semibold">${sel.title}</span><${Pill} state=${sel.state} /><${Btn} size="xs" kind="ghost" className="ml-auto" onClick=${() => api.select(null)}>✕</${Btn}></div>
          <div className="font-mono text-[11px] text-zinc-500">${sel.room} · ${sel.branch} ← ${sel.base} · ${sel.model} · +${stats(sel).add} −${stats(sel).del}${sel.pr ? ` · PR #${sel.pr.n}` : ''}</div>
          <${Actions} t=${sel} api=${api} />
        </div>
        ${sel.pending && html`<div className="border-b border-zinc-800 p-2"><${Pending} t=${sel} api=${api} /></div>`}
        <${Transcript} t=${sel} />
        <details className="max-h-[40%] overflow-y-auto border-t border-zinc-800"><summary className="cursor-pointer px-3 py-2 text-sm text-zinc-300">Changes · ${sel.diff.length} files</summary><${Changes} t=${sel} /></details>
        <${Composer} t=${sel} api=${api} />
      </div>`}
    </main>
  </div>`;
}

// ============================== Variant C — Focus ==============================
function VariantC({ s, api }) {
  const [palette, setPalette] = useState(false), [bi, setBi] = useState(0);
  const sel = s.threads.find(t => t.id === s.selected);
  const needs = needing(s), cur = needs[bi % Math.max(needs.length, 1)];
  const ts = s.threads.filter(t => t.room === s.room);
  useEffect(() => {
    const k = e => { if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); setPalette(p => !p); } if (e.key === 'Escape') setPalette(false); };
    addEventListener('keydown', k); return () => removeEventListener('keydown', k);
  }, []);
  const bubble = t => html`<div className=${'w-44 cursor-pointer rounded-lg border px-2 py-1.5 text-[11px] shadow-lg ' + (t.state === 'Needs-you' ? 'pulse border-amber-400 bg-amber-500 text-black' : 'border-zinc-700 bg-zinc-950/90')}>
    <div className="flex items-center gap-1"><span className="truncate font-semibold">${t.title}</span></div>
    <div className="mt-0.5 flex items-center gap-1">${t.state === 'Needs-you' ? html`<b>needs you · ${waited(t)}</b>` : html`<${Pill} state=${t.state} />`}<span className=${'ml-auto ' + (t.state === 'Needs-you' ? '' : 'text-zinc-500')}>${t.model}</span></div>
    <div className=${'truncate font-mono text-[10px] ' + (t.state === 'Needs-you' ? 'text-black/70' : 'text-zinc-500')}>${t.branch.replace('office/', '')}${t.pr ? ` · PR #${t.pr.n}` : ''}</div>
  </div>`;
  return html`<div className="relative h-full">
    <${Scene} className="absolute inset-0" threads=${ts} selected=${s.selected} onPick=${api.select} bubble=${bubble} ring />
    <div className="absolute left-3 top-3 flex items-center gap-2"><span className="rounded-lg bg-zinc-950/80 px-3 py-1.5 font-semibold">AI Office</span><${RoomTabs} s=${s} api=${api} className="rounded-lg bg-zinc-950/80 p-1" /></div>
    <div className="absolute right-3 top-3"><${Btn} kind="primary" onClick=${() => setPalette(true)}>+ New Thread <kbd className="ml-1 rounded bg-zinc-300 px-1 text-[10px]">Ctrl K</kbd></${Btn}></div>
    ${cur && html`<div className="absolute left-1/2 top-14 z-20 w-[440px] -translate-x-1/2 rounded-xl border border-amber-500 bg-zinc-950/95 p-2 shadow-2xl">
      <div className="mb-1.5 flex items-center gap-2 px-1 text-xs"><span className="rounded bg-amber-500 px-1.5 font-bold text-black">${needs.length} need${needs.length === 1 ? 's' : ''} you</span><span className="text-zinc-500">${cur.room}</span><span className="truncate font-medium">${cur.title}</span>
        <span className="ml-auto flex gap-1">${needs.length > 1 && html`<${Btn} size="xs" kind="ghost" onClick=${() => setBi(bi + 1)}>next ›</${Btn}>`}<${Btn} size="xs" kind="ghost" onClick=${() => api.select(cur.id)}>open</${Btn}></span></div>
      <${Pending} t=${cur} api=${api} /></div>`}
    ${sel && html`<div className="absolute inset-x-3 bottom-14 z-30 flex h-[46%] overflow-hidden rounded-xl border border-zinc-800 bg-zinc-950/95 shadow-2xl">
      <div className="flex min-w-0 flex-[3] flex-col">
        <div className="flex items-center gap-2 border-b border-zinc-800 px-3 py-2"><span className="truncate font-semibold">${sel.title}</span><${Pill} state=${sel.state} /><span className="ml-auto"><${Actions} t=${sel} api=${api} /></span></div>
        <${Transcript} t=${sel} chat />
        ${sel.pending && html`<div className="px-3 pb-2"><${Pending} t=${sel} api=${api} /></div>`}
        <${Composer} t=${sel} api=${api} chat />
      </div>
      <div className="flex min-w-0 flex-[2] flex-col border-l border-zinc-800">
        <div className="flex items-center border-b border-zinc-800 px-3 py-2 text-sm text-zinc-300">Changes<${Btn} size="xs" kind="ghost" className="ml-auto" onClick=${() => api.select(null)}>✕</${Btn}></div>
        <div className="min-h-0 flex-1 overflow-y-auto"><${Changes} t=${sel} /></div>
      </div>
    </div>`}
    ${palette && html`<div className="fixed inset-0 z-40 bg-black/50" onClick=${() => setPalette(false)}>
      <div className="mx-auto mt-[12vh] w-[620px] rounded-xl border border-zinc-700 bg-zinc-950 p-3 shadow-2xl" onClick=${e => e.stopPropagation()}>
        <${NewThreadForm} s=${s} api=${api} autoFocus onDone=${() => setPalette(false)} />
        <div className="mt-2 text-[11px] text-zinc-500">Ctrl+Enter to start · Esc to close</div>
      </div></div>`}
  </div>`;
}

// ============================== app + switcher ==============================
const VARIANTS = { A: ['Dock', VariantA], B: ['Inbox', VariantB], C: ['Focus', VariantC] };
const KEYS = Object.keys(VARIANTS);

function Switcher({ v, set }) {
  const cycle = d => set(KEYS[(KEYS.indexOf(v) + d + KEYS.length) % KEYS.length]);
  useEffect(() => {
    const k = e => { if (e.target.closest('input,textarea,select,[contenteditable]')) return; if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1); };
    addEventListener('keydown', k); return () => removeEventListener('keydown', k);
  });
  return html`<div className="fixed bottom-3 left-1/2 z-50 flex -translate-x-1/2 items-center gap-3 rounded-full bg-fuchsia-200 px-2 py-1 text-sm font-semibold text-black shadow-xl">
    <button className="h-7 w-7 rounded-full bg-black text-white" onClick=${() => cycle(-1)}>←</button>
    <span>${v} (${VARIANTS[v][0]})</span>
    <button className="h-7 w-7 rounded-full bg-black text-white" onClick=${() => cycle(1)}>→</button>
  </div>`;
}

function App() {
  const qs = new URLSearchParams(location.search);
  const [v, setV] = useState(KEYS.includes(qs.get('variant')) ? qs.get('variant') : 'A');
  const [s, dispatch] = useReducer(reducer, null, initial);
  useEffect(() => { const i = setInterval(() => dispatch({ type: 'tick' }), 1800); return () => clearInterval(i); }, []);
  const n = needing(s).length;
  useEffect(() => { document.title = n ? `(${n}) AI Office` : 'AI Office'; }, [n]);
  const set = k => { qs.set('variant', k); history.replaceState(null, '', '?' + qs); setV(k); };
  const api = {
    select: id => dispatch({ type: 'select', id }), room: room => dispatch({ type: 'room', room }),
    allow: id => dispatch({ type: 'allow', id }), deny: (id, note) => dispatch({ type: 'deny', id, note }),
    answer: (id, option) => dispatch({ type: 'answer', id, option }), send: (id, text) => dispatch({ type: 'send', id, text }),
    interrupt: id => dispatch({ type: 'interrupt', id }), stop: id => dispatch({ type: 'stop', id }), done: id => dispatch({ type: 'done', id }),
    retry: id => dispatch({ type: 'retry', id }), end: id => dispatch({ type: 'end', id }), discard: id => dispatch({ type: 'discard', id }),
    newThread: o => dispatch({ type: 'new', ...o }),
  };
  const V = VARIANTS[v][1];
  return html`<${React.Fragment}><${V} key=${v} s=${s} api=${api} /><${Switcher} v=${v} set=${set} /></${React.Fragment}>`;
}
createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
